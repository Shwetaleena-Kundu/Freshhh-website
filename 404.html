<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Page Not Found | Freshhh</title>

  <!-- Favicon -->
  <link
    rel="shortcut icon"
    href="./favicon.ico"
    type="image/x-icon"
  >

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Font Awesome 5 -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
  >

  <!-- Shared CSS -->
  <link
    rel="stylesheet"
    href="./Css/main.css"
  >

  <!-- 404 page CSS -->
  <link
    rel="stylesheet"
    href="./Css/404.css"
  >

  <!-- Responsive CSS -->
  <link
    rel="stylesheet"
    href="./Css/responsive-style.css"
  >
</head>


<body>

  <!-- 404 page starts -->
  <main class="error-page">
    <div class="container">

      <div class="error-content">

        <!-- Logo -->
        <a class="error-logo" href="index.html">
          <img
            src="./Images/logo.png"
            alt="Freshhh logo"
          >
        </a>


        <!-- 404 illustration -->
        <div class="error-number">

          <span>4</span>

          <div class="error-fruit">
            <i class="fas fa-apple-alt"></i>
          </div>

          <span>4</span>

        </div>


        <!-- Message -->
        <span class="error-label">
          Oops! Something went wrong
        </span>

        <h1>Page Not Found</h1>

        <p>
          The page you are looking for may have been moved,
          deleted or never existed.
        </p>


        <!-- Buttons -->
        <div class="error-buttons">

          <a class="home-button" href="index.html">
            <i class="fas fa-home"></i>
            Back to Home
          </a>

          <a class="shop-button" href="product.html">
            Explore Products
            <i class="fas fa-arrow-right"></i>
          </a>

        </div>

      </div>

    </div>
  </main>
  <!-- 404 page ends -->


  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    <script src="./Js/main.js"></script>
  ></script>

</body>

</html>
