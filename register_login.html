<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account | Freshhh</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
  >

  <!-- Registration CSS -->
  <link rel="stylesheet" href="./Css/login.css">
</head>

<body>

  <main>

    <form id="register-form" novalidate>

      <!-- Logo -->
      <img
        class="form-logo"
        src="./Images/logo.png"
        alt="Freshhh logo"
      >

      <!-- Form heading -->
      <h2>Create an Account</h2>

      <p>Fresh goodness is only a step away</p>

      <!-- Full name -->
      <div>
        <label for="name">Full Name:</label>

        <div class="input-box">
          <i class="fas fa-user"></i>

          <input
            type="text"
            id="name"
            name="fullName"
            placeholder="Enter your full name"
            required
          >
        </div>
      </div>

      <!-- Email -->
      <div>
        <label for="email">Email:</label>

        <div class="input-box">
          <i class="fas fa-envelope"></i>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          >
        </div>
      </div>

      <!-- Password -->
      <div>
        <label for="password">Password:</label>

        <div class="input-box">
          <i class="fas fa-lock"></i>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
          >

          <i class="fas fa-eye eye-icon"></i>
        </div>
      </div>

      <!-- Confirm password -->
      <div>
        <label for="confirm-password">
          Confirm Password:
        </label>

        <div class="input-box">
          <i class="fas fa-lock"></i>

          <input
            type="password"
            id="confirm-password"
            name="confirmPassword"
            placeholder="Enter your password again"
            required
          >

          <i class="fas fa-eye eye-icon"></i>
        </div>
      </div>

      <!-- Phone number -->
      <div>
        <label for="phone">Phone Number:</label>

        <div class="input-box">
          <i class="fas fa-phone"></i>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
          >
        </div>
      </div>

      <!-- Terms checkbox -->
      <div class="terms-box">

        <input
          type="checkbox"
          id="terms"
          name="terms"
          required
        >

        <label for="terms">
          I agree to the terms and conditions
        </label>

      </div>

      <!-- Submit button -->
      <div>
        <button type="submit">
          Create Account
        </button>
      </div>

      <!-- Login link -->
      <p class="form-footer">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </form>

  </main>
<script src="./Js/main.js"></script>
</body>

</html>
